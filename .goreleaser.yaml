# Release builds: `git tag v0.1.0 && git push --tags` runs .github/workflows/release.yml.
version: 2
project_name: tauko

builds:
  - main: ./cmd/tauko
    env: [CGO_ENABLED=0] # pure-Go SQLite: no C toolchain needed
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    ldflags: ["-s -w -X main.version={{ .Version }}"]

archives:
  - formats: [tar.gz]
    # Stable names, so install.sh can use releases/latest/download/<name>.
    name_template: "tauko_{{ .Os }}_{{ .Arch }}"
    files: [LICENSE, README.md]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude: ["^docs:", "^test:"]
