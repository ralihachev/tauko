<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1720">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>tauko</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="brand">tauko</div>
  <div id="signal" class="signal" hidden></div>
  <div id="counts" class="counts"></div>
</header>

<nav>
  <button data-view="learn" class="active">Learn</button>
  <button data-view="quiz">Quiz</button>
  <button data-view="units">Courses</button>
  <div class="mode" role="group" aria-label="mode">
    <button data-mode="tap">tap</button>
    <button data-mode="type">type</button>
  </div>
</nav>

<main>
  <section id="view-learn" class="view">
    <div id="scope" class="scope"></div>
    <div id="card" class="card"></div>
  </section>
  <section id="view-quiz" class="view" hidden>
    <div id="quiz" class="card"></div>
  </section>
  <section id="view-units" class="view" hidden>
    <div id="units" class="units"></div>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
